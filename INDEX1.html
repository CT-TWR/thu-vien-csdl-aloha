<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện CSDL Số ĐKSKL Cần Thơ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    
    .iframe-container iframe {
      position: absolute;
      /* Giảm xuống -24px để vừa đủ giấu thanh xanh mà không che thanh header */
      top: -6px; 
      left: 0;
      width: 100%;
      /* Bù lại chiều cao tương ứng */
      height: calc(100% + 6px); 
      border: none;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe src="https://script.google.com/macros/s/AKfycbyVbx4kB6aZkud0NeBs7onN1uptRDR7HMtHNnla_sX2iUvYB-pb4WJqzymgRUQiUOdY/exec" allow="geolocation; microphone; camera"></iframe>
  </div>

</body>
</html>
